[project]
name = "saleor-app"
version = "0.3.0"
description = "Saleor app framework"
authors = [
    {name = "Martin Trapp", email = "info@martintrapp.com"},
    {name = "Saleor Commerce", email = "hello@saleor.io"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=20.0.0",
    "aiohttp>=3.0.0",
    "fastapi>=0.110.0",
    "jinja2>=2.11.0",
    "jwt>=1.0.0",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.35.0",
]

[project.optional-dependencies]
sqs = [
    "boto3>=1.20.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s -v --durations=0 --disable-warnings --tb short"
cache_dir = ".cache/pytest_cache"
asyncio_mode = "auto"
